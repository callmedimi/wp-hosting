version: '3.8'

services:
  bind9:
    image: ubuntu/bind9:latest
    container_name: shared_geodns
    user: root
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./config:/etc/bind
      - ./records:/var/lib/bind
      - ./cache:/var/cache/bind
    environment:
      - BIND9_USER=root
      - TZ=UTC
    networks:
      - wp_shared_net
    restart: unless-stopped

  dns_ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: custom-olivetin:latest
    container_name: shared_geodns_ui
    user: root
    ports:
      - "1337:1337"
    volumes:
      - ./config/olivetin.yaml:/config/config.yaml
      - ../..:/opt/wp-hosting:rw
      - ./records:/var/lib/bind:rw
      - ./config:/etc/bind:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=UTC
    networks:
      - wp_shared_net
    restart: unless-stopped
    depends_on:
      - bind9

networks:
  wp_shared_net:
    external: true

